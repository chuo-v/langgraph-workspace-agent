# ==============================================================================
# LangGraph Workspace Agent - Production Stack
# ==============================================================================
# This stack defines the core orchestration engine, local telemetry (Langfuse),
# persistent memory (Redis/Chroma/Postgres), and secure ingress (Cloudflare).
# ==============================================================================

name: langgraph-workspace-agent

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace_agent_gateway
    # Sets the container execution user context (useful for Linux Docker socket permissions)
    user: ${GATEWAY_USER:-root}
    env_file:
      - .env
    environment:
      # Override the allowed paths to restrict the agent's filesystem access
      - ALLOWED_PATHS=${HOST_WORKSPACE_DIR}
      # Explicitly set the host's Ollama URL since we are inside a container network
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # Target the 'redis' service for persistent LangGraph state checkpointing
      - REDIS_URL=redis://redis:6379/0
      # Internal network address targeting the 'langfuse' Compose service
      - LANGFUSE_HOST=http://langfuse:3000
      # Direct the agent to write its memory to the isolated state directory
      - AGENT_PROFILE_PATH=/app/state/user_profile.json
      # Force uv to use a persistent directory to cache wheel downloads across isolated CI runs
      - UV_CACHE_DIR=/app/.uv_cache
    volumes:
      # Pass the Docker socket so the Python SDK can spawn ephemeral sibling sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
      # Symmetrical mount required for Docker-out-of-Docker sandbox spawning
      - ${HOST_WORKSPACE_DIR}:${HOST_WORKSPACE_DIR}
      # Persist the local vector memory across container rebuilds
      - ./.chroma:/app/.chroma
      # Mount a dedicated state directory to isolate sensitive data from the repo root
      - ${WORKSPACE_AGENT_STATE_DIR:-./agent_state}:/app/state
      # Inject the dynamic routing and workspace configuration file
      - ${WORKSPACE_AGENT_CONFIG_PATH:-./config.yaml}:/app/config.yaml
      # Mount the persistent cache to eliminate cold-start dependency installations in ephemeral /tmp workspaces
      - uv_cache:/app/.uv_cache
    ports:
      # Webhook reverse-proxy will route incoming traffic here
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Enables reaching the host machine (e.g., local Ollama) from inside the container
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: workspace_agent_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: workspace_agent_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: workspace_agent_clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: workspace_agent_minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: workspace_agent_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin ${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO to start...';
        sleep 2;
      done;
      mc mb myminio/langfuse-events --ignore-existing;
      "

  langfuse:
    image: langfuse/langfuse:latest
    container_name: workspace_agent_langfuse_server
    depends_on:
      - postgres
      - clickhouse
      - minio
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - REDIS_CONNECTION_STRING=redis://redis:6379
      # WARNING: Standard local development secrets.
      # This stack is designed strictly for local, air-gapped execution.
      # DO NOT use these static strings in a public-facing or production deployment.
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - NEXTAUTH_URL=http://localhost:3000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    container_name: workspace_agent_langfuse_worker
    depends_on:
      - postgres
      - clickhouse
      - minio
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - REDIS_CONNECTION_STRING=redis://redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

  cloudflared:
    # NOTE: Comment out this entire 'cloudflared' service block if you are using
    # an alternative ingress solution (such as Ngrok or a local reverse proxy).
    image: cloudflare/cloudflared:latest
    container_name: workspace_agent_tunnel
    restart: unless-stopped
    environment:
      # Ingests the token from .env to establish the Zero Trust tunnel
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - gateway

  sandbox-firewall:
    image: docker:cli
    container_name: workspace_agent_firewall
    privileged: true
    network_mode: host
    environment:
      # Expose these to the entrypoint script, defaulting to Cloudflare and Quad9
      - TRUSTED_DNS_PRIMARY=${TRUSTED_DNS_PRIMARY:-1.1.1.1}
      - TRUSTED_DNS_SECONDARY=${TRUSTED_DNS_SECONDARY:-9.9.9.9}
    volumes:
      # Required to manage networks and inspect the sandbox_net ID dynamically
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache iptables &&

      # Flush previous rules to prevent rule stacking
      iptables -F DOCKER-USER 2>/dev/null || true &&

      if ! docker network inspect sandbox_net >/dev/null 2>&1; then
        docker network create --driver bridge sandbox_net;
      fi &&

      # Extract the network bridge ID and dynamic subnet CIDR
      NETWORK_ID=$$(docker network inspect sandbox_net -f '{{.Id}}' | cut -c 1-12) &&
      BR_NAME=\"br-$$NETWORK_ID\" &&
      SUBNET=$$(docker network inspect sandbox_net -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}') &&

      # ========================================================================
      # FIREWALL RULES (Executed in REVERSE order of evaluation due to '-I')
      # ========================================================================

      # DROP generic DNS queries
      iptables -I DOCKER-USER -i $$BR_NAME -p udp --dport 53 -j DROP &&
      iptables -I DOCKER-USER -i $$BR_NAME -p tcp --dport 53 -j DROP &&

      # DROP RFC1918 Local IP ranges
      # Blocks access to local host networks, Postgres, Redis, etc.
      iptables -I DOCKER-USER -i $$BR_NAME -d 10.0.0.0/8 -j DROP &&
      iptables -I DOCKER-USER -i $$BR_NAME -d 172.16.0.0/12 -j DROP &&
      iptables -I DOCKER-USER -i $$BR_NAME -d 192.168.0.0/16 -j DROP &&

      # ALLOW DNS ONLY to trusted resolvers
      # Placed above the RFC1918 drops so whitelisted resolvers are permitted
      # even if they reside on a private network range (e.g., corporate 10.x.x.x).
      iptables -I DOCKER-USER -i $$BR_NAME -d $$TRUSTED_DNS_PRIMARY -p udp --dport 53 -j ACCEPT &&
      iptables -I DOCKER-USER -i $$BR_NAME -d $$TRUSTED_DNS_PRIMARY -p tcp --dport 53 -j ACCEPT &&

      iptables -I DOCKER-USER -i $$BR_NAME -d $$TRUSTED_DNS_SECONDARY -p udp --dport 53 -j ACCEPT &&
      iptables -I DOCKER-USER -i $$BR_NAME -d $$TRUSTED_DNS_SECONDARY -p tcp --dport 53 -j ACCEPT &&

      # ALLOW intra-subnet traffic
      # Ensures the sandbox can communicate with its own default gateway to route outbound.
      iptables -I DOCKER-USER -i $$BR_NAME -d $$SUBNET -j ACCEPT &&

      echo \"Airgap active. Subnet $$SUBNET whitelisted. Allowed DNS: $$TRUSTED_DNS_PRIMARY and $$TRUSTED_DNS_SECONDARY\" &&
      tail -f /dev/null
      "
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  clickhouse_data:
  minio_data:
  uv_cache:

networks:
  default:
  sandbox_net:
    name: sandbox_net
    driver: bridge