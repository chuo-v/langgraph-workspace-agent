[tool.poetry]
name = "langgraph-workspace-agent"
version = "0.5.0"
description = "FastAPI-based webhook gateway and orchestrator for an autonomous LangGraph workspace agent"
authors = ["Vernon Chuo Chian Khye"]
readme = "README.md"
packages = [{include = "workspace_agent", from = "src"}]

[project]
name = "langgraph-workspace-agent"
version = "0.5.0"
description = "FastAPI-based webhook gateway and orchestrator for an autonomous LangGraph workspace agent"
authors = [
    { name = "Vernon Chuo Chian Khye", email = "vchuo93@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1,<0.138.0",
    "uvicorn>=0.49.0,<0.50.0",
    "langchain>=1.3.9,<2.0.0",
    "langchain-anthropic>=1.4.6,<2.0.0",
    "langchain-core>=1.4.7,<2.0.0",
    "langchain-google-genai>=4.2.5,<5.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-openai>=1.3.2,<2.0.0",
    "langgraph>=1.2.5,<2.0.0",
    "langgraph-checkpoint-redis>=0.4.1,<0.5.0",
    "pydantic>=2.13.4,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "redis>=7.4.1,<8.0.0",
    "langfuse>=4.9.0,<5.0.0",
    "chromadb>=1.5.9,<2.0.0",
    "GitPython>=3.1.50,<4.0.0",
    "docker>=7.1.0,<8.0.0",
    "ollama>=0.6.2,<1.0.0",
    "pypdf>=5.0.0,<6.0.0"
]

[project.optional-dependencies]
mcp = ["mcp>=1.28.0,<2.0.0"]

[tool.ruff]
target-version = "py311"

line-length = 100

# directory exclusions
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".chroma",
]

[tool.ruff.lint]
# rulesets to enable
# E/F: Pyflakes and Error (Standard)
# I: Isort (Import sorting)
# N: pep8-naming
# UP: pyupgrade (Modernize syntax)
# PL: Pylint
# B: Bugbear (Common bugs)
# D: pydocstyle (Docstring rules)
select = ["E", "F", "I", "N", "UP", "PL", "B", "D"]

# rules to ignore
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D203", # 1 blank line required before class docstring (formatter conflict)
    "D205", # 1 blank line required between summary line and description
    "D213", # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.isort]
# ensure imports are sorted and grouped logically
known-first-party = ["src"]

[tool.ruff.lint.pylint]
# Global override to allow up to 8 arguments per function definition
max-args = 8

[tool.ruff.lint.pydocstyle]
# Enforce Google-style docstring structures for standard LLM parsing
convention = "google"

[tool.ruff.format]
# standardize on double quotes and consistent indentation
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# ignore "magic values" (PLR2004) and docstring limits in the tests directory
"tests/**/*" = ["PLR2004", "D"]

[tool.pytest.ini_options]
# treat root of repo as a source directory
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--ignore=tests/evals/fixtures"
filterwarnings = [
    # suppress LangChain's allowed_objects warning
    "ignore:.*The default value of `allowed_objects` will change in a future version.*",
    # suppress environment variable path warning if it originates from the git package
    "ignore:.*The use of environment variables in paths is deprecated.*::git.*",
    # suppress FastAPI/Starlette internal deprecation noise regarding the TestClient
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning"
]

[tool.poetry.scripts]
# allows booting the local dev server via: `poetry run dev`
dev = "uvicorn src.workspace_agent.main:app --reload --host 127.0.0.1 --port 8000"